<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Memory Studio · CD 앨범</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235343b2'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23dcd4f6'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%235343b2'/%3E%3C/svg%3E"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font:15px system-ui,sans-serif;background:transparent;color:#fff}.album{position:relative;max-width:1000px;margin:auto;aspect-ratio:1.78;background:linear-gradient(125deg,#385989,#5f467e);overflow:hidden}.disc{position:absolute;width:44%;aspect-ratio:1;right:6%;top:13%;border-radius:50%;object-fit:cover;border:3px solid #191a23;box-shadow:0 12px 30px #16132055;animation:spin 12s linear infinite;animation-play-state:paused}.hub{position:absolute;right:26%;top:48%;width:4.4%;aspect-ratio:1;background:#333744;border:5px solid #d0d2e0;border-radius:50%;transform:translate(50%,-50%)}.sleeve{position:absolute;left:10%;top:8%;width:48%;aspect-ratio:1;box-shadow:7px 9px 0 #15132288,0 20px 28px #14152640;border:1px solid #bec9e777;overflow:hidden}.sleeve>img{width:100%;height:100%;object-fit:cover}.sleeve:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#ffffff45,transparent 5%,#ffffff20 6%,transparent 7%);border-left:12px solid #b9c8dd30}.play{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:17%;aspect-ratio:1;border-radius:50%;border:1px solid #ffffff55;background:#6e546eaf;color:white;font-size:clamp(16px,3vw,38px);cursor:pointer}.caption{position:absolute;left:10%;bottom:2%;width:76%;white-space:pre-wrap;text-shadow:0 2px 5px #0006}.caption strong{font-size:clamp(14px,2vw,22px)}.caption p{margin:3px 0;font-size:clamp(12px,1.5vw,17px)}.player-wrap{width:min(100%,480px);min-width:200px;min-height:200px;margin:8px auto;background:#111;border-radius:8px;overflow:hidden}.player-wrap iframe{display:block;width:100%;height:270px;min-height:200px;border:0}#message{max-width:700px;margin:8px auto;text-align:center;font:13px/1.5 system-ui;color:#606176;background:#f7f7fa;padding:7px 12px;border-radius:8px}.native .album{display:none}.native .player-wrap{margin:0;width:100%;border-radius:0}.native .player-wrap iframe{height:210px}.native #message{margin:0;border-radius:0}.portrait .album{aspect-ratio:2/3;max-width:660px}.portrait .sleeve{left:10%;width:70%;top:7%}.portrait .disc{width:52%;right:8%;top:43%}.portrait .hub{right:31.6%;top:60%;width:6%}.portrait .caption{bottom:5%}@keyframes spin{to{transform:rotate(360deg)}}button:focus-visible{outline:3px solid #ffe089}
</style></head><body><main id="album" class="album"><img id="disc" class="disc" alt="회전하는 CD"><span class="hub"></span><div class="sleeve"><img id="cover" alt="앨범 커버"><button id="toggle" class="play" aria-label="재생">▶</button></div><div class="caption"><strong id="title"></strong><p id="caption"></p></div></main><div class="player-wrap"><div id="player"></div></div><p id="message">유튜브 링크를 연결하면 음악을 재생할 수 있습니다.</p><script>
'use strict';const q=new URLSearchParams(location.search),native=q.get('native')==='1';if(native)document.body.classList.add('native');if(q.get('portrait')==='1')document.body.classList.add('portrait');
const safeImage=v=>{try{const u=new URL(v);return u.protocol==='https:'?u.href:''}catch{return ''}},img=safeImage(q.get('img'));for(const id of ['cover','disc']){const el=document.getElementById(id);if(img)el.src=img;else el.style.visibility='hidden'}document.getElementById('title').textContent=q.get('title')||'my memory';document.getElementById('caption').textContent=q.get('sub')||'';
function videoId(value){if(/^[a-zA-Z0-9_-]{11}$/.test(value||''))return value;try{const u=new URL(value);let id='';if(u.hostname==='youtu.be')id=u.pathname.slice(1).split('/')[0];else if(['youtube.com','www.youtube.com','m.youtube.com','www.youtube-nocookie.com'].includes(u.hostname))id=u.searchParams.get('v')||u.pathname.split('/').filter(Boolean).pop();return /^[a-zA-Z0-9_-]{11}$/.test(id)?id:''}catch{return ''}}
const id=videoId(q.get('yt'));let player,playing=false;const msg=document.getElementById('message'),toggle=document.getElementById('toggle');function send(value){if(window.chrome&&window.chrome.webview)window.chrome.webview.postMessage(value)}function state(play){playing=play;document.getElementById('disc').style.animationPlayState=play?'running':'paused';toggle.textContent=play?'Ⅱ':'▶';toggle.setAttribute('aria-label',play?'일시정지':'재생');send(play?'playing':'paused')}
window.togglePlayback=function(){if(!player||typeof player.getPlayerState!=='function'){msg.textContent='플레이어를 불러오는 중입니다.';return}if(player.getPlayerState()===1)player.pauseVideo();else player.playVideo()};window.pausePlayback=function(){if(player&&player.pauseVideo)player.pauseVideo()};toggle.addEventListener('click',window.togglePlayback);
window.onYouTubeIframeAPIReady=function(){if(!id)return;player=new YT.Player('player',{height:'270',width:'480',videoId:id,playerVars:{autoplay:1,playsinline:1,controls:1,origin:location.origin,rel:0},events:{onReady:e=>{msg.textContent='자동재생이 시작되지 않으면 재생 버튼을 눌러 주세요.';e.target.playVideo();send('ready')},onStateChange:e=>{state(e.data===1);if(e.data===1)msg.textContent='재생 중 · 앨범 버튼으로 일시정지 / 이어서 재생';else if(e.data===2)msg.textContent='일시정지 · 재생 버튼을 누르면 이어서 재생됩니다.';else if(e.data===0)msg.textContent='재생이 끝났습니다. 재생 버튼으로 다시 시작하세요.'},onAutoplayBlocked:()=>{state(false);msg.textContent='자동재생이 차단되었습니다. 유튜브 플레이어의 재생 버튼을 눌러 주세요.';send('blocked')},onError:e=>{state(false);msg.textContent='유튜브 재생 오류 ('+e.data+'). 비공개·연령 제한·외부 재생 제한 여부를 확인해 주세요.';send('error:'+e.data)}}})};if(id){const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.onerror=()=>{msg.textContent='유튜브에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.';send('error:network')};document.head.appendChild(script)}else{msg.textContent='유효한 유튜브 링크를 입력해 주세요.';send('error:invalid')}
</script></body></html>
